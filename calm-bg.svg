<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dreamy Calm Aurora Sky Gradient -->
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="30%" stop-color="#e0f2fe" />
      <stop offset="65%" stop-color="#fce7f3" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <radialGradient id="orbBlue" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbPink" cx="85%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGold" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#fce7f3" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Main Sky Canvas -->
  <rect width="1920" height="1080" fill="url(#bgBase)" />
  <rect width="1920" height="1080" fill="url(#orbBlue)" />
  <rect width="1920" height="1080" fill="url(#orbPink)" />
  <rect width="1920" height="1080" fill="url(#orbGold)" />

  <!-- Soft Cinema Projector Light Beams -->
  <polygon points="0,0 750,1080 320,1080" fill="#ffffff" fill-opacity="0.22" />
  <polygon points="1920,0 1170,1080 1600,1080" fill="#ffffff" fill-opacity="0.22" />

  <!-- Floating Bokeh Circles -->
  <g fill="#ffffff">
    <circle cx="280" cy="180" r="55" fill-opacity="0.3" />
    <circle cx="420" cy="320" r="28" fill-opacity="0.35" />
    <circle cx="1620" cy="210" r="65" fill-opacity="0.28" />
    <circle cx="1460" cy="360" r="34" fill-opacity="0.35" />
    <circle cx="960" cy="140" r="45" fill-opacity="0.25" />
    <circle cx="190" cy="620" r="40" fill-opacity="0.3" />
    <circle cx="1740" cy="600" r="48" fill-opacity="0.3" />
  </g>

  <!-- Left Aesthetic Film Reel & Clapper Accent -->
  <g transform="translate(150, 230) rotate(-12)" opacity="0.22">
    <circle cx="0" cy="0" r="115" fill="none" stroke="#4f46e5" stroke-width="8" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="10,8" />
    <circle cx="0" cy="0" r="26" fill="#4f46e5" />
    <circle cx="0" cy="-62" r="20" fill="#4f46e5" />
    <circle cx="0" cy="62" r="20" fill="#4f46e5" />
    <circle cx="-62" cy="0" r="20" fill="#4f46e5" />
    <circle cx="62" cy="0" r="20" fill="#4f46e5" />
  </g>

  <!-- Right Aesthetic Film Reel Accent -->
  <g transform="translate(1760, 250) rotate(15)" opacity="0.22">
    <circle cx="0" cy="0" r="125" fill="none" stroke="#db2777" stroke-width="8" />
    <circle cx="0" cy="0" r="103" fill="none" stroke="#db2777" stroke-width="2" stroke-dasharray="10,8" />
    <circle cx="0" cy="0" r="28" fill="#db2777" />
    <circle cx="0" cy="-68" r="22" fill="#db2777" />
    <circle cx="0" cy="68" r="22" fill="#db2777" />
    <circle cx="-68" cy="0" r="22" fill="#db2777" />
    <circle cx="68" cy="0" r="22" fill="#db2777" />
  </g>

  <!-- Flowing Silk Waves at Bottom -->
  <path d="M0,700 C380,610 760,820 1180,710 C1520,620 1740,700 1920,660 L1920,1080 L0,1080 Z" fill="url(#waveGrad1)" />
  <path d="M0,810 C480,730 920,910 1420,800 C1680,740 1810,790 1920,770 L1920,1080 L0,1080 Z" fill="#ffffff" fill-opacity="0.65" />

  <!-- Subtle Sparkle Stars -->
  <g fill="url(#goldStar)" opacity="0.55">
    <polygon points="340,110 346,126 362,132 346,138 340,154 334,138 318,132 334,126" />
    <polygon points="1540,120 1545,134 1559,139 1545,144 1540,158 1535,144 1521,139 1535,134" />
    <polygon points="620,210 624,220 634,224 624,228 620,238 616,228 606,224 616,220" />
    <polygon points="1310,220 1314,230 1324,234 1314,238 1310,248 1306,238 1296,234 1306,230" />
  </g>
</svg>
